schema_version: 1
concepts:
  - concept: current package version
    authority: plugins/bedrock/.claude-plugin/plugin.json#/version
    repetitions:
      - {path: "plugins/bedrock/skills/{skill}/PACKAGE_IDENTITY.json", classification: generated-carrier, drift_control: all 15 copies are regenerated from and validated byte-for-byte against the manifest authority}
      - {path: plugins/bedrock/CHANGELOG.md, classification: contextual-restatement, drift_control: package-governance validator requires the current candidate identity}
      - {path: release tag, classification: generated-carrier, drift_control: "release-mode validator requires v{manifest_version} at the accepted source commit"}
  - concept: repository license
    authority: LICENSE
    repetitions:
      - {path: plugins/bedrock/LICENSE, classification: generated-carrier, drift_control: byte-for-byte validator equality}
      - {path: plugins/bedrock/.claude-plugin/plugin.json#/license, classification: generated-carrier, drift_control: manifest and marketplace metadata equality}
      - {path: packages/agent-core/LICENSE, classification: generated-carrier, drift_control: source-to-wheel build requires exact Bedrock license equality}
  - concept: shared Python implementation
    authority: packages/agent-core/src/agent_core/
    repetitions:
      - {path: plugins/bedrock/skills/agent-builder/assets/python/, classification: generated-carrier, drift_control: deterministic wheel build verifies source member hashes and component/dependency identities}
  - concept: skill semantics
    authority: "plugins/bedrock/skills/{skill}/SKILL.md"
    repetitions:
      - {path: "plugins/bedrock/skills/{skill}/reference/", classification: contextual-restatement, drift_control: relative-package and domain-contract validators}
      - {path: "plugins/bedrock/skills/{skill}/templates/", classification: contextual-restatement, drift_control: schema and behavior fixtures}
  - concept: skill lifecycle
    authority: plugins/bedrock/governance/registry.yaml#/skills
    repetitions:
      - {path: plugins/bedrock/governance/COMPATIBILITY.md, classification: contextual-restatement, drift_control: package-governance validator}
  - concept: routing precedence
    authority: docs/architecture/skill-architecture.md#/3-routing-precedence
    repetitions:
      - {path: tests/fixtures/routing.yaml, classification: generated-carrier, drift_control: deterministic fixture coverage and retained routing evaluation}
      - {path: plugins/bedrock/governance/QUICKSTART.md, classification: contextual-restatement, drift_control: package-governance validator and shared routing fixtures}
  - concept: safety floor
    authority: docs/adr/ADR-001-portable-core-and-surface-adapter-architecture.md#/26-safety-floor
    repetitions:
      - {path: tests/fixtures/safety/manifest.yaml, classification: generated-carrier, drift_control: HEB-110 safety validator}
      - {path: domain skill security guidance, classification: contextual-restatement, drift_control: domain contract validators}
  - concept: package lifecycle
    authority: plugins/bedrock/governance/README.md
    repetitions:
      - {path: README.md, classification: contextual-restatement, drift_control: package-governance validator}
      - {path: CLAUDE.md, classification: contextual-restatement, drift_control: orientation marker validation}
      - {path: plugins/bedrock/governance/release-evidence.schema.json, classification: generated-carrier, drift_control: schema and release-mode validation}
      - {path: plugins/bedrock/governance/release-evidence.template.yaml, classification: generated-carrier, drift_control: JSON Schema validation at release}
      - {path: plugins/bedrock/governance/rollout-ledger.template.yaml, classification: generated-carrier, drift_control: JSON Schema validation at release}
  - concept: production distribution boundary
    authority: plugins/bedrock/governance/registry.yaml#/distribution
    repetitions:
      - {path: .claude-plugin/marketplace.json#/plugins/0/source, classification: generated-carrier, drift_control: package-governance validator requires the accepted production source}
      - {path: docs/repository-orientation.md#/change-and-release-path, classification: contextual-restatement, drift_control: package-governance orientation validation}
      - {path: plugins/bedrock/governance/README.md#/candidate-and-release-states, classification: contextual-restatement, drift_control: package-governance lifecycle marker validation}
      - {path: plugins/bedrock/governance/release-evidence.schema.json#/properties/landing, classification: generated-carrier, drift_control: schema and release-mode validation}
  - concept: repository orientation
    authority: docs/repository-orientation.md
    repetitions:
      - {path: CLAUDE.md, classification: contextual-restatement, drift_control: package-governance orientation validation}
      - {path: local root AGENTS.md, classification: contextual-restatement, drift_control: ignored local file; never staged or packaged}
  - concept: infrastructure versus application delivery ownership
    authority: docs/architecture/skill-architecture.md#/3-routing-precedence
    repetitions:
      - {path: plugins/bedrock/skills/infrastructure-code/SKILL.md, classification: contextual-restatement, drift_control: infrastructure and delivery contract validator}
      - {path: plugins/bedrock/skills/app-delivery-pipeline/SKILL.md, classification: contextual-restatement, drift_control: infrastructure and delivery contract validator}
  - concept: evaluation thresholds
    authority: validation/eval-policy.yaml
    repetitions:
      - {path: README.md, classification: contextual-restatement, drift_control: deterministic policy and report validator}
      - {path: docs/evidence/heb-109/routing-results.json, classification: generated-carrier, drift_control: report identity and eligibility validation}
  - concept: shared lifecycle vocabulary
    authority: plugins/bedrock/governance/vocabulary.yaml
    repetitions:
      - {path: plugins/bedrock/governance/release-evidence.schema.json, classification: generated-carrier, drift_control: package-governance vocabulary parity validation}
      - {path: plugins/bedrock/governance/rollout-ledger.schema.json, classification: generated-carrier, drift_control: package-governance vocabulary parity validation}
  - concept: planning current adoption
    authority: plugins/bedrock/skills/planning/PACKAGE_ADOPTION.json
    repetitions:
      - {path: plugins/bedrock/skills/planning/reference/provenance.md, classification: contextual-restatement, drift_control: exact accepted historical source digest; current adoption explicitly supersedes its pending labels}
      - {path: plugins/bedrock/skills/planning/agents/openai.yaml, classification: contextual-restatement, drift_control: package validator requires allow_implicit_invocation false}
  - concept: local data-hygiene control
    authority: plugins/bedrock/scripts/data-hygiene/README.md
    repetitions:
      - {path: selected machine runtime pre-commit, classification: generated-carrier, drift_control: isolated staged-blob branch and fault contract tests}
      - {path: installed repository pre-commit dispatcher, classification: generated-carrier, drift_control: exact rendered dispatcher and runtime integrity tests}
      - {path: project-template/README.md, classification: contextual-restatement, drift_control: package validator requires install and audit checkpoint}
      - {path: project-template/CLAUDE.md, classification: contextual-restatement, drift_control: package validator requires commit-readiness invariant}
