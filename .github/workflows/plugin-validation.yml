name: Plugin validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_live_routing:
        description: Run the authenticated Claude routing adapter
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - name: Set up Node for frontend contract gates
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: tests/fixtures/frontend-contracts/browser-app/package-lock.json
      - name: Set up Terraform for state-safety fixtures
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false
      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt
      - name: Install pinned shared-core build tools
        run: |
          python -m venv "$RUNNER_TEMP/bedrock-validation"
          echo "$RUNNER_TEMP/bedrock-validation/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bedrock-validation/bin/python" -m pip install -r validation/requirements.txt -r packages/agent-core/build-requirements.txt
      - name: Verify source-derived distributed core
        run: python scripts/build_agent_core.py --check
      - name: Install distributed core and offline fixture dependencies
        run: |
          python plugins/bedrock/skills/agent-builder/scripts/install_core.py --python "$(command -v python)"
          python -m pip install --require-hashes --only-binary=:all: -r tests/fixtures/agent-readiness/requirements-lock.txt
          python -m pip install pytest==9.1.1
      - name: Run shared-core and offline specialist tests
        run: |
          python -m pytest -p no:cacheprovider packages/agent-core/tests
          python tests/fixtures/agent-readiness/run_offline_tests.py --evidence-dir "$RUNNER_TEMP/heb154-offline"
      - name: Verify clean skill-only install and contrary identities
        run: python scripts/verify_agent_core_install.py --evidence-dir "$RUNNER_TEMP/heb154-clean-install"
      - name: Retain shared-core evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: heb-154-shared-core
          path: |
            ${{ runner.temp }}/heb154-offline
            ${{ runner.temp }}/heb154-clean-install/*.txt
            ${{ runner.temp }}/heb154-clean-install/results.json
          if-no-files-found: warn
      - name: Install pinned frontend fixture dependencies
        working-directory: tests/fixtures/frontend-contracts/browser-app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit frontend fixture dependencies
        working-directory: tests/fixtures/frontend-contracts/browser-app
        run: npm audit --audit-level=high
      - name: Install pinned frontend browser engines
        working-directory: tests/fixtures/frontend-contracts/browser-app
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Install pinned Claude Code validator
        # Exercise the oldest supported host, not a single-version support ceiling.
        run: npm install --global @anthropic-ai/claude-code@2.1.226
      - name: Run seeded validator tests
        env:
          HEB110_REQUIRE_DOCKER: "1"
          HEB110_REQUIRE_TERRAFORM: "1"
        run: python -m unittest discover -s tests -v
      - name: Run strict package validation
        run: >-
          python scripts/validate_plugin.py
          --routing-evidence docs/evidence/heb-161/routing-results.json
          --inventory docs/evidence/heb-109/metadata-inventory.json
      - name: Run HEB-118 package-governance validation
        run: python scripts/validate_package_governance.py
      - name: Run HEB-110 safety contract validation
        run: python scripts/validate_safety.py
      - name: Run HEB-113 infrastructure and delivery contract validation
        run: python scripts/validate_infrastructure_delivery_contracts.py
      - name: Run HEB-114 frontend contract validation
        run: python scripts/validate_frontend_contracts.py
      - name: Run HEB-114 frontend deterministic and browser gates
        working-directory: tests/fixtures/frontend-contracts/browser-app
        run: >-
          npm run typecheck &&
          npm run lint &&
          npm run unit &&
          npm run coverage &&
          npm run build &&
          npm run budget &&
          npm run browser
      - name: Retain HEB-114 frontend gate evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: heb-114-frontend-gate-evidence
          path: |
            tests/fixtures/frontend-contracts/browser-app/coverage/coverage-summary.json
            tests/fixtures/frontend-contracts/browser-app/test-results/results.json
          if-no-files-found: warn
      - name: Run isolated install and reload smoke test
        run: bash scripts/smoke_clean_install.sh
      - name: Retain deterministic validation inventory
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: heb-109-deterministic-inventory
          path: docs/evidence/heb-109/metadata-inventory.json
          if-no-files-found: error

  core-minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10"
      - name: Verify minimum Python install and controls
        run: python scripts/verify_agent_core_install.py --evidence-dir "$RUNNER_TEMP/heb154-minimum"
      - name: Run core regressions on the installed minimum-runtime wheel
        run: |
          "$RUNNER_TEMP/heb154-minimum/venv/bin/python" -m pip install pytest==9.1.1
          "$RUNNER_TEMP/heb154-minimum/venv/bin/python" -m pytest -p no:cacheprovider packages/agent-core/tests
      - name: Retain minimum-runtime evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: heb-154-python-minimum
          path: |
            ${{ runner.temp }}/heb154-minimum/*.txt
            ${{ runner.temp }}/heb154-minimum/results.json
          if-no-files-found: warn

  live-routing:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_live_routing)
    needs: [deterministic, core-minimum]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install validation dependencies
        run: python -m pip install -r validation/requirements.txt
      - name: Install pinned Claude Code adapter
        # Exercise the oldest supported host, not a single-version support ceiling.
        run: npm install --global @anthropic-ai/claude-code@2.1.226
      - name: Run repeated routing regression suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >-
          python scripts/run_routing_evals.py
          --profile ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
          --expected-cli-version "2.1.226 (Claude Code)"
          --model claude-haiku-4-5-20251001
          --expected-model claude-haiku-4-5-20251001
          --max-budget-usd 0.06
          --max-total-budget-usd 3.00
          --output "$RUNNER_TEMP/heb161-routing/report.json"
      - name: Retain routing results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: heb-161-routing-results
          path: |
            ${{ runner.temp }}/heb161-routing/report.json
            ${{ runner.temp }}/heb161-routing/report.jsonl
          if-no-files-found: error
