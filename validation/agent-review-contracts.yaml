          product_binding_sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          product_binding_owner: product-review-owner
          product_binding_authority: product/review-workflow
