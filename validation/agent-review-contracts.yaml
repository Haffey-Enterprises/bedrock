          subject_sha256: cd5d6b575b77d0aa1489c5ce6df921b3d4c99bf286e1f13e2b0a275877212a7e
          result: confirmed
    expected: runner-backed-claim-permitted
  - id: runner-backed-with-digest-only
    input:
      <<: *complete_runner_case
      runner_version: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    expected: stop-unavailable
  - id: runner-backed-with-malformed-semver
    input:
      <<: *complete_runner_case
      runner_version: 02.1.0
    expected: stop-unavailable
  - id: runner-backed-without-subject-bound-evidence
    input:
      <<: *complete_runner_case
      evidence: null
    expected: stop-unavailable
  - id: runner-backed-with-narration-only-evidence
    input: {profile: runner-backed, product_binding_id: product-review-workflow, product_binding_version: 1.0.0, runner_id: product-review-runner, runner_version: 2.1.0, schemas_compatible: true, invocation: "product-review run --profile convergence", fresh_gate_evidence: true}
    expected: stop-unavailable
