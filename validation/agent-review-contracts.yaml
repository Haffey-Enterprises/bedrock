          validator_profile: convergence
        required_actor_ids: [laa, sa, ea, cross-set]
        actor_results:
          - {id: laa, outcome: completed, evidence_sha256: "1111111111111111111111111111111111111111111111111111111111111111"}
          - {id: sa, outcome: completed, evidence_sha256: "2222222222222222222222222222222222222222222222222222222222222222"}
          - {id: ea, outcome: completed, evidence_sha256: "3333333333333333333333333333333333333333333333333333333333333333"}
          - {id: cross-set, outcome: completed, evidence_sha256: "4444444444444444444444444444444444444444444444444444444444444444"}
        required_gate_ids: [schema, identity, lifecycle, convergence]
        gate_results:
          - {id: schema, outcome: passed, evidence_sha256: "5555555555555555555555555555555555555555555555555555555555555555"}
          - {id: identity, outcome: passed, evidence_sha256: "6666666666666666666666666666666666666666666666666666666666666666"}
          - {id: lifecycle, outcome: passed, evidence_sha256: "7777777777777777777777777777777777777777777777777777777777777777"}
          - {id: convergence, outcome: passed, evidence_sha256: "8888888888888888888888888888888888888888888888888888888888888888"}
        ledger_sha256: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        evidence_manifest_sha256: ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff
        verification:
          method: second-derivation
