name: Pull request image build safety fixture

"on":
  pull_request:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - name: Build service image without publishing
        run: docker build --tag heb-110-safety:${{ github.sha }} tests/fixtures/safety/python-service
